name: Update AIRAC Version

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-airac-version:
    runs-on: ubuntu-latest
    env:
      RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Write release name to AIRAC_VERSION.txt
        run: |
          printf '%s' "$RELEASE_NAME" > ORBB/Plugins/AIRAC_VERSION.txt
          echo "AIRAC_VERSION.txt set to: $RELEASE_NAME"

      - name: Create branch, commit and open PR
        run: |
          git add ORBB/Plugins/AIRAC_VERSION.txt
          if git diff --cached --quiet; then
            echo "No change to AIRAC_VERSION.txt"
            exit 0
          fi

          BRANCH="airac/$(printf '%s' "$RELEASE_NAME" | tr -c 'A-Za-z0-9._-' '-')"

          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "Update AIRAC_VERSION.txt to $RELEASE_NAME"
          git push --force origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update AIRAC_VERSION.txt to $RELEASE_NAME" \
            --body "Automated update of \`ORBB/Plugins/AIRAC_VERSION.txt\` to \`$RELEASE_NAME\` following release [$RELEASE_NAME](${{ github.event.release.html_url }})." \
            --reviewer JYang365