name: Sync AIRAC Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/airac-cycles.yml"
  schedule:
    - cron: "0 0 * * *" # 0000z daily
  workflow_dispatch:
    inputs:
      max_upcoming:
        description: "Number of upcoming AIRAC cycles to create labels for"
        required: false
        type: number
        default: 4

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/airac-cycles.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Sync labels and milestones
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          MAX_UPCOMING: ${{ inputs.max_upcoming || 4 }}
        shell: bash
        run: |
          LABEL_COLOR="DC521D"
          TODAY=$(date -u +%Y-%m-%d)
          CUTOFF_DATE=$(date -u -d "-90 days" +%Y-%m-%d 2>/dev/null \
                     || date -u -v-90d +%Y-%m-%d) # GNU/BSD compat

          echo "Syncing AIRAC labels and milestones (today: $TODAY, cutoff: $CUTOFF_DATE, max upcoming: $MAX_UPCOMING)..."

          # ── Helpers ────────────────────────────────────────────────────────────

          # Returns the milestone number for a given title, or empty string
          milestone_number() {
            local title="$1"
            gh api --paginate "repos/$GH_REPO/milestones?state=all&per_page=100" \
              --jq ".[] | select(.title == \"$title\") | .number" | head -1
          }

          # Creates or updates a milestone; echoes its number. An existing
          # milestone keeps its state so a cycle closed by AIRAC Tag stays closed.
          upsert_milestone() {
            local title="$1" due_date="$2" description="$3"
            local due_on="${due_date}T00:00:00Z"
            local existing
            existing=$(milestone_number "$title")

            if [[ -n "$existing" ]]; then
              gh api "repos/$GH_REPO/milestones/$existing" -X PATCH \
                -f title="$title" \
                -f description="$description" \
                -f due_on="$due_on" \
                --silent
              echo "$existing"
            else
              gh api "repos/$GH_REPO/milestones" -X POST \
                -f title="$title" \
                -f description="$description" \
                -f due_on="$due_on" \
                -f state="open" \
                --jq '.number'
            fi
          }

          # Deletes a milestone if it exists and has never had any issues or PRs,
          # so closed milestones keep the history of what shipped in each cycle
          delete_milestone_if_empty() {
            local title="$1"
            local number
            number=$(milestone_number "$title")
            [[ -z "$number" ]] && return 0

            local items
            items=$(gh api "repos/$GH_REPO/milestones/$number" --jq '.open_issues + .closed_issues')
            if [[ "$items" -eq 0 ]]; then
              gh api "repos/$GH_REPO/milestones/$number" -X DELETE --silent
              echo "Deleted milestone: $title"
            else
              echo "Keeping milestone: $title ($items items)"
            fi
          }

          # Deletes a label if it exists and no open PR uses it
          delete_label_if_unused() {
            local label="$1" reason="$2"
            [[ " ${existing_labels[*]} " == *" $label "* ]] || return 0

            local open_prs
            open_prs=$(gh pr list --repo "$GH_REPO" --label "$label" \
              --state open --json number --jq 'length')
            if [[ "$open_prs" -eq 0 ]]; then
              echo "Deleting $reason label: $label"
              gh label delete "$label" --repo "$GH_REPO" --yes
            else
              echo "Keeping $reason label: $label ($open_prs open PRs)"
            fi
          }

          # Prints "date cycle" for every entry in the cycles file. Tolerates CRLF
          # line endings and a missing newline after the last entry.
          read_cycles() {
            awk -F: '$1 ~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ {
              cycle = $2; gsub(/[ "\r]/, "", cycle); print $1, cycle
            }' .github/airac-cycles.yml
          }

          mapfile -t existing_labels < <(gh label list --repo "$GH_REPO" \
            --search "airac/" --limit 500 --json name --jq '.[].name')

          # ── Collect upcoming cycle dates ───────────────────────────────────────

          upcoming=()
          while read -r date cycle; do
            if [[ ! "$date" < "$TODAY" ]]; then
              upcoming+=("$date")
            fi
          done < <(read_cycles | sort)

          # Keep only the next N upcoming cycles
          upcoming=("${upcoming[@]:0:$MAX_UPCOMING}")

          # ── Process all entries ────────────────────────────────────────────────

          labels_synced=0
          milestones_synced=0

          while read -r date cycle; do
            label="airac/$cycle"
            milestone_title="AIRAC $cycle"

            if [[ "$date" < "$CUTOFF_DATE" ]]; then
              # ── Stale: delete label and milestone if nothing references them ──
              delete_label_if_unused "$label" "stale"
              delete_milestone_if_empty "$milestone_title"

            elif [[ " ${upcoming[*]} " == *" $date "* ]]; then
              # ── Upcoming window: create/update label and milestone ─────────────
              description="AIRAC $cycle - effective $date"
              gh label create "$label" --repo "$GH_REPO" \
                --color "$LABEL_COLOR" --description "$description" --force
              echo "Synced label: $label"
              (( labels_synced++ )) || true

              ms_number=$(upsert_milestone "$milestone_title" "$date" "$description")
              echo "Synced milestone: $milestone_title (due $date, #$ms_number)"
              (( milestones_synced++ )) || true

            else
              # ── Out-of-window: delete if empty ────────────────────────────────
              delete_label_if_unused "$label" "out-of-window"
              delete_milestone_if_empty "$milestone_title"
            fi

          done < <(read_cycles)

          echo "### ✅ AIRAC sync complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Labels synced:** $labels_synced" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Milestones synced:** $milestones_synced" >> "$GITHUB_STEP_SUMMARY"

      # Opens an issue with the next cycles ready to paste once the cycles file
      # is close to its last entry, and closes it again once the file is extended
      - name: Check cycles file expiry
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          WARN_DAYS: 180
        shell: bash
        run: |
          ISSUE_TITLE="AIRAC cycles file is running out"
          TODAY=$(date -u +%Y-%m-%d)

          read -r LAST_DATE LAST_CYCLE < <(
            awk -F: '$1 ~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ {
              cycle = $2; gsub(/[ "\r]/, "", cycle); print $1, cycle
            }' .github/airac-cycles.yml | sort | tail -1
          )

          DAYS_LEFT=$(( ($(date -u -d "$LAST_DATE" +%s) - $(date -u -d "$TODAY" +%s)) / 86400 ))
          echo "Last cycle in file: $LAST_CYCLE ($LAST_DATE), $DAYS_LEFT days away"

          EXISTING=$(gh issue list --repo "$GH_REPO" --state open \
            --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)

          if (( DAYS_LEFT > WARN_DAYS )); then
            if [[ -n "$EXISTING" ]]; then
              gh issue close "$EXISTING" --repo "$GH_REPO" \
                --comment "The cycles file now runs to AIRAC $LAST_CYCLE ($LAST_DATE). Closing."
              echo "Closed issue #$EXISTING"
            fi
            exit 0
          fi

          if [[ -n "$EXISTING" ]]; then
            echo "Issue #$EXISTING already open"
            exit 0
          fi

          # AIRAC cycles are every 28 days; numbering restarts at 01 each year.
          # Generate everything up to the end of the following calendar year.
          last_year=${LAST_DATE:0:4}
          prev_date="$LAST_DATE" prev_num=$((10#${LAST_CYCLE:2:2}))
          snippet=""
          while :; do
            d=$(date -u -d "$prev_date + 28 days" +%Y-%m-%d)
            y=${d:0:4}
            (( 10#$y > 10#$last_year + 1 )) && break
            if [[ "$y" == "${prev_date:0:4}" ]]; then n=$((prev_num + 1)); else n=1; fi
            [[ "$y" != "${prev_date:0:4}" ]] && snippet+=$'\n'"# AIRAC dates for $y"$'\n'
            snippet+=$(printf '%s: "%s%02d"' "$d" "${y:2:2}" "$n")$'\n'
            prev_date="$d" prev_num=$n
          done

          BODY="The last entry in \`.github/airac-cycles.yml\` is **AIRAC $LAST_CYCLE** (effective $LAST_DATE), $DAYS_LEFT days from now. After that date the AIRAC labels, milestones, gate and tags stop working.

          Append the next cycles to the file (generated on a 28-day cadence - check them against the official AIRAC schedule):

          \`\`\`yaml
          ${snippet}\`\`\`

          This issue closes automatically once the file runs more than $WARN_DAYS days ahead."

          gh issue create --repo "$GH_REPO" --title "$ISSUE_TITLE" --body "$BODY"
          echo "### ⚠️ AIRAC cycles file runs out on $LAST_DATE - issue opened" >> "$GITHUB_STEP_SUMMARY"
