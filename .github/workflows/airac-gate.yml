name: AIRAC Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, labeled, unlabeled, synchronize]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: "AIRAC ✓"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check AIRAC labels
        id: check
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          AIRAC_LABELS=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json labels \
            --jq '[.labels[].name | select(startswith("airac/"))] | join(" ")')

          if [[ -z "$AIRAC_LABELS" ]]; then
            echo "No AIRAC label found - gate open."
            echo "has_label=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found AIRAC label(s): $AIRAC_LABELS"
          echo "has_label=true" >> "$GITHUB_OUTPUT"
          echo "labels=$AIRAC_LABELS" >> "$GITHUB_OUTPUT"

      - name: Checkout cycles file
        if: steps.check.outputs.has_label == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Read the cycles file from the base branch so a PR cannot edit its own gate
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/airac-cycles.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}

      - name: Evaluate gate
        if: steps.check.outputs.has_label == 'true'
        id: gate
        env:
          LABELS: ${{ steps.check.outputs.labels }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          # With several AIRAC labels, the latest effective date wins
          CYCLE="" LABEL="" EFFECTIVE_DATE=""
          for label in $LABELS; do
            cycle="${label#airac/}"
            date=$(awk -F: -v c="$cycle" '
              { v = $2; gsub(/[ "\r]/, "", v) }
              $1 ~ /^[0-9]{4}-[0-9]{2}-[0-9]{2}$/ && v == c { print $1; exit }
            ' .github/airac-cycles.yml)

            if [[ -z "$date" ]]; then
              echo "::error::Label '$label' references unknown AIRAC cycle '$cycle'. Check .github/airac-cycles.yml."
              exit 1
            fi

            if [[ -z "$EFFECTIVE_DATE" || "$date" > "$EFFECTIVE_DATE" ]]; then
              CYCLE="$cycle" LABEL="$label" EFFECTIVE_DATE="$date"
            fi
          done

          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "effective_date=$EFFECTIVE_DATE" >> "$GITHUB_OUTPUT"

          if [[ "$TODAY" < "$EFFECTIVE_DATE" ]]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::error::Merge blocked until $EFFECTIVE_DATE (AIRAC $CYCLE)"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "AIRAC $CYCLE is effective ($EFFECTIVE_DATE <= $TODAY). Gate open."
          fi

      - name: Post or update comment
        if: steps.check.outputs.has_label == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CYCLE: ${{ steps.gate.outputs.cycle }}
          LABEL: ${{ steps.gate.outputs.label }}
          BLOCKED: ${{ steps.gate.outputs.blocked }}
          EFFECTIVE_DATE: ${{ steps.gate.outputs.effective_date }}
        run: |
          MARKER="<!-- airac-gate-bot -->"

          if [[ "$BLOCKED" == "true" ]]; then
            BODY="$MARKER
          > [!CAUTION]
          > **Merge blocked** - This PR targets **AIRAC cycle $CYCLE** (effective $EFFECTIVE_DATE).
          >
          > The merge check will pass automatically once the cycle date arrives.
          >
          > [View all PRs for AIRAC $CYCLE](https://github.com/$GH_REPO/pulls?q=is%3Apr+is%3Aopen+label%3A${LABEL/\//%2F})"
          else
            BODY="$MARKER
          > [!TIP]
          > **AIRAC cycle $CYCLE** is now effective ($EFFECTIVE_DATE). This PR is ready to merge!"
          fi

          COMMENT_ID=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)

          if [[ -n "$COMMENT_ID" ]]; then
            gh api "repos/$GH_REPO/issues/comments/$COMMENT_ID" \
              -X PATCH -f body="$BODY" --silent
            echo "Updated existing comment $COMMENT_ID"
          else
            gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              -f body="$BODY" --silent
            echo "Posted new comment"
          fi

      - name: Fail if blocked
        if: steps.gate.outputs.blocked == 'true'
        env:
          CYCLE: ${{ steps.gate.outputs.cycle }}
          EFFECTIVE_DATE: ${{ steps.gate.outputs.effective_date }}
        run: |
          echo "### ❌ AIRAC Gate - Blocked" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Merge is blocked until **$EFFECTIVE_DATE** (AIRAC $CYCLE). Enable **auto-merge** to merge automatically when the gate opens." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Pass
        if: steps.check.outputs.has_label != 'true' || steps.gate.outputs.blocked != 'true'
        run: |
          echo "### ✅ AIRAC Gate - Open" >> "$GITHUB_STEP_SUMMARY"
