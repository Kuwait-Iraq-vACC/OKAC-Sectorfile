name: General Report
description: A question, suggestion or anything that does not fit another template.
title: "[GENERAL]: "
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I have searched the [existing issues](https://github.com/Kuwait-Iraq-vACC/OKAC-Sectorfile/issues?q=is%3Aissue) and this has not been reported yet.
          required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What is your question or suggestion?"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Drag images here. Radar screen captures make display problems much faster to fix."
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: "Anything else that helps."
    validations:
      required: false
