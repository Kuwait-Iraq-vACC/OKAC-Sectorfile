name: Bug Report
description: Something in the sectorfile or a profile is broken or wrong.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For TopSky, Ground Radar, GNG or plugin problems, the dedicated templates route the report to the right people faster.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I have searched the [existing issues](https://github.com/Kuwait-Iraq-vACC/OKAC-Sectorfile/issues?q=is%3Aissue) and this has not been reported yet.
          required: false
        - label: I am on the [latest release](https://github.com/Kuwait-Iraq-vACC/OKAC-Sectorfile/releases) and the [EuroScope version](http://kuwait-iraqvacc.net/Controller%20Guidance/Software/EuroScope%20Setup/) from the setup guide.
          required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: "What is wrong?"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: "Steps that make the problem appear."
      placeholder: |
        1. Load the ... profile
        2. Connect as ...
        3. Open ...
        4. See ...
    validations:
      required: false
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: "What should happen instead?"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Drag images here. Radar screen captures make display problems much faster to fix."
    validations:
      required: false
  - type: dropdown
    id: profiles
    attributes:
      label: Profile(s)
      description: "Which .prf profile(s) show the problem?"
      multiple: true
      options:
        - "Kuwait Aerodrome"
        - "Kuwait Military"
        - "Kuwait Radar - Light Mode"
        - "Kuwait Radar - Realistic"
        - "Kuwait Terminal"
        - "All / not profile specific"
    validations:
      required: false
  - type: input
    id: aerodrome
    attributes:
      label: Aerodrome / Sector
      description: "ICAO code(s) or sector name, if specific to one."
      placeholder: e.g. OKKK
    validations:
      required: false
  - type: input
    id: sectorfile-airac
    attributes:
      label: Sectorfile AIRAC
      description: "Shown in OKAC/Plugins/AIRAC_VERSION.txt."
      placeholder: e.g. 2611
    validations:
      required: false
  - type: input
    id: euroscope-version
    attributes:
      label: EuroScope Version
      description: "The EuroScope build you are running."
      placeholder: e.g. 3.2.3.2 or 3.2.9
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error Messages / Logs
      description: "Paste any EuroScope or plugin error message. It is formatted as code automatically."
      render: text
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: "Anything else that helps."
    validations:
      required: false
