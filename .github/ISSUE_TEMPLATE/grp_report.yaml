name: Ground Radar plugin Report
description: Ground layouts, stands or other Ground Radar plugin data.
title: "[GroundRadar]: "
labels: ["enhancement", "GRplugin"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for ground layouts, stand assignment and other GRplugin data, including NOTAM closures of taxiways or stands.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I have searched the [existing issues](https://github.com/Kuwait-Iraq-vACC/OKAC-Sectorfile/issues?q=is%3Aissue) and this has not been reported yet.
          required: false
        - label: I am on the [latest release](https://github.com/Kuwait-Iraq-vACC/OKAC-Sectorfile/releases) and the [EuroScope version](http://kuwait-iraqvacc.net/Controller%20Guidance/Software/EuroScope%20Setup/) from the setup guide.
          required: false
  - type: dropdown
    id: component
    attributes:
      label: Area
      description: "What part of the Ground Radar data is affected?"
      multiple: false
      options:
        - "Ground layout / map"
        - "Stands / stand assignment"
        - "Colours / symbols"
        - "Approach window"
        - "Other"
    validations:
      required: false
  - type: input
    id: aerodrome
    attributes:
      label: Aerodrome / Sector
      description: "ICAO code(s) or sector name, if specific to one."
      placeholder: e.g. OKKK
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What is wrong, or what needs to change?"
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Source / Reference
      description: "AIP section or amendment, NOTAM number, chart or link that backs up the change. Required for real-world data changes."
      placeholder: |
        e.g. AIP AD 2.24, AIP AMDT 11/26, NOTAM A0481/26
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: "Steps that make the problem appear."
      placeholder: |
        1. Load the ... profile
        2. Connect as ...
        3. Open ...
        4. See ...
    validations:
      required: false
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: "What should happen instead?"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Drag images here. Radar screen captures make display problems much faster to fix."
    validations:
      required: false
  - type: input
    id: sectorfile-airac
    attributes:
      label: Sectorfile AIRAC
      description: "Shown in OKAC/Plugins/AIRAC_VERSION.txt."
      placeholder: e.g. 2611
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error Messages / Logs
      description: "Paste any EuroScope or plugin error message. It is formatted as code automatically."
      render: text
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: "Anything else that helps."
    validations:
      required: false
