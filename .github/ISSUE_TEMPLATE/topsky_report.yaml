name: TopSky Report
description: Maps, areas, symbology, settings or other TopSky data.
title: "[TOPSKY]: "
labels: ["bug", "TopSky"]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting a bug, check that you have the correct [EuroScope version](http://kuwait-iraqvacc.net/Controller%20Guidance/Software/EuroScope%20Setup/) and the latest sectorfile installed.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I have searched the [existing issues](https://github.com/Kuwait-Iraq-vACC/OKAC-Sectorfile/issues?q=is%3Aissue) and this has not been reported yet.
          required: false
        - label: I am on the [latest release](https://github.com/Kuwait-Iraq-vACC/OKAC-Sectorfile/releases) and the [EuroScope version](http://kuwait-iraqvacc.net/Controller%20Guidance/Software/EuroScope%20Setup/) from the setup guide.
          required: false
  - type: dropdown
    id: topsky-package
    attributes:
      label: TopSky package
      description: "Which TopSky set is affected?"
      multiple: true
      options:
        - "TopSky"
        - "TopSky - Light"
        - "TopSky Aerodrome"
        - "All"
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Area
      description: "What part of TopSky is affected?"
      multiple: true
      options:
        - "Maps"
        - "Areas / restricted airspace"
        - "Airspace / sectors"
        - "MSAW"
        - "STCA / APW"
        - "SSR codes"
        - "CPDLC"
        - "Radars"
        - "Symbols / colours"
        - "Settings / views"
        - "Other"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What is wrong, or what needs to change?"
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Source / Reference
      description: "AIP section or amendment, NOTAM number, chart or link that backs up the change. Required for real-world data changes."
      placeholder: |
        e.g. AIP AD 2.24, AIP AMDT 11/26, NOTAM A0481/26
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: "Steps that make the problem appear."
      placeholder: |
        1. Load the ... profile
        2. Connect as ...
        3. Open ...
        4. See ...
    validations:
      required: false
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: "What should happen instead?"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: "Drag images here. Radar screen captures make display problems much faster to fix."
    validations:
      required: false
  - type: dropdown
    id: profiles
    attributes:
      label: Profile(s)
      description: "Which .prf profile(s) show the problem?"
      multiple: true
      options:
        - "Kuwait Aerodrome"
        - "Kuwait Military"
        - "Kuwait Radar - Light Mode"
        - "Kuwait Radar - Realistic"
        - "Kuwait Terminal"
        - "All / not profile specific"
    validations:
      required: false
  - type: input
    id: sectorfile-airac
    attributes:
      label: Sectorfile AIRAC
      description: "Shown in OKAC/Plugins/AIRAC_VERSION.txt."
      placeholder: e.g. 2612/01
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error Messages / Logs
      description: "Paste any EuroScope or plugin error message. It is formatted as code automatically."
      render: text
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: "Anything else that helps."
    validations:
      required: false
